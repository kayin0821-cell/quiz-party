<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4ebfd">
<title>諮詢科小天使票選</title>
<meta name="description" content="2026 諮詢科小天使票選：最佳 Duty 1 名、最佳同事 5 名，每人每項一票，可以留言給他們，11/12（四）23:59 截止投票。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cellipse cx=%2250%22 cy=%2250%22 rx=%2240%22 ry=%2216%22 fill=%22none%22 stroke=%22%23f2b730%22 stroke-width=%2210%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="preload" as="image" href="img/angel-pray.webp">
<link rel="stylesheet" href="../quiz.css?v=4">
<link rel="stylesheet" href="vote.css?v=10">
</head>
<body>
<main class="wrap" id="app"><p class="muted center" style="margin-top:40px">載入中…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../quiz.js?v=4"></script>
<script>
(function () {
  const { sb, $, esc, toast, store, announce } = QP;
  let view = 'intro', published = null;
  const app = $('#app');
  const TEAMS = ['一組', '二組', '三組', '四組', '五組', '六組'];
  const DEADLINE = '11/12（四）23:59 截止投票';

  // ---- 手繪風 SVG ----
  const STAR = (s, c = 'var(--gold)') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.1l6.1-.7z" fill="${c}" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const SPARK = (s, c = 'var(--gold)') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c.8 5.6 2.4 8.4 11 11-8.6 2.6-10.2 5.4-11 11-.8-5.6-2.4-8.4-11-11 8.6-2.6 10.2-5.4 11-11z" fill="${c}"/></svg>`;
  const HEART = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C6 16.6 3 13.4 3 9.6 3 7 5 5 7.5 5c1.9 0 3.3 1 4.5 2.6C13.2 6 14.6 5 16.5 5 19 5 21 7 21 9.6c0 3.8-3 7-9 10.9z" fill="none" stroke="var(--pink)" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
  const CROWN = (n, color) => `<svg class="crown" viewBox="0 0 48 40" aria-hidden="true"><path d="M5 34 3 11l11 9 10-15 10 15 11-9-2 23z" fill="#fff" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round"/><circle cx="3" cy="11" r="3" fill="var(--gold)"/><circle cx="24" cy="5" r="3" fill="var(--gold)"/><circle cx="45" cy="11" r="3" fill="var(--gold)"/><circle cx="24" cy="25" r="8.5" fill="${color}"/><text x="24" y="29.5" text-anchor="middle" font-size="12" fill="#fff" font-family="Huninn, sans-serif">${n}</text></svg>`;
  const WING = '<svg class="wing" viewBox="0 0 52 34" aria-hidden="true"><path d="M50 18C42 6 26 2 4 6c6 3 10 5 12 8-5 0-9 1-12 3 6 1 10 3 12 6-4 1-6 3-7 5 15 2 30-1 41-10z" fill="#fff" stroke="#4a8fd0" stroke-width="2.4" stroke-linejoin="round"/></svg>';
  const EYEOFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1C11 6 11.5 6 12 6c5 0 8.5 4.5 9.5 6-.5.8-1.6 2.2-3.2 3.6M6.4 7.6C4.5 8.9 3.1 10.6 2.5 12c1 1.5 4.5 6 9.5 6 1.6 0 3-.4 4.3-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const IMG = (n, cls, alt = '') => `<img class="${cls}" src="img/angel-${n}.webp" alt="${alt}" width="180" height="200" decoding="async">`;
  const deco = (html, style, tw) => `<span class="deco ${tw ? 'twinkle' : ''}" style="${style}">${html}</span>`;

  let people = [], isOpen = true, code = '', me = null, hadEntry = false;
  let pick = { duty: null, peer: null }, msg = { duty: '', peer: '' };
  let peerTeam = '一組', peerQuery = '';
  const byId = (id) => people.find((p) => p.id === id);
  const fmt = (v) => v.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^CSC/, '').slice(0, 5);
  const MAXMSG = 200;

  // ---------- 首頁 ----------
  function showIntro() {
    if (published) return showWinners();
    view = 'intro';
    app.innerHTML = `
      <header class="hero">
        ${deco(STAR(22), 'left:8%;top:6px', true)}${deco(SPARK(16), 'right:16%;top:2px', true)}${deco(HEART(20), 'right:6%;top:58px')}${deco(SPARK(12, 'var(--pink)'), 'left:22%;top:66px', true)}
        ${IMG('pray', 'sticker l')}${IMG('heart', 'sticker r')}
        <span class="year">2026</span>
        <h1 class="title-big">諮詢科<br>小天使</h1>
        <div class="ribbon-row">${WING}<span class="ribbon">票選</span><span class="wing r" style="display:inline-flex">${WING}</span></div>
      </header>
      <p class="callout">諮詢科是一個大家庭，<br>我們是<span class="hl">最強的二線</span>！</p>
      <p class="lead">在忙碌的工作中，總有一些小天使默默付出、<br>在你需要幫忙時伸出援手，<br>讓你忍不住覺得：<br>「有他／她在，真的太好了！」</p>
      <span class="banner">快來投下你神聖的一票！</span>

      <div class="awards-title">${STAR(18, 'var(--yellow)')}票選獎項</div>
      <div class="awards">
        <div class="award duty">${CROWN(1, 'var(--gold)')}<h3>最佳 Duty</h3><span class="quota">1 名</span><p>最可靠的神隊友，<br>關鍵時刻總能即時支援！</p></div>
        <div class="award peer">${CROWN(2, '#4a8fd0')}<h3>最佳同事</h3><span class="quota">5 名</span><p>暖心又給力，<br>讓工作更順利、團隊更有溫度！</p></div>
      </div>

      <section class="cloudcard" style="margin-top:22px;text-align:center">
        ${isOpen ? `<p style="margin:0;font-size:22px"><span class="mark">${DEADLINE}</span></p>
          <p class="lead small" style="margin-top:8px">每人在兩個獎項各有一票，還可以寫下想對他說的話。<br>輸入員工編號就能投票，截止前都可以回來修改。</p>
          <button class="btn block pink" id="startBtn" type="button" style="margin-top:16px;min-height:58px;font-size:21px">開始投票</button>
`
        : `${IMG('pray', 'done-art')}<p style="font-size:22px;margin:0">投票已經截止，謝謝大家！</p>`}
      </section>
      <p class="signoff">Together We are Stronger!</p>
      <p class="small muted center" style="margin:4px 0 8px">諮詢科最強二線，因為有你們而更強大！</p>`;
    const b = $('#startBtn'); if (b) b.onclick = () => showCode();
  }

  // ---------- 員工編號 ----------
  function showCode(err) {
    view = 'code';
    app.innerHTML = `
      <div class="brand" style="margin-top:6px"><div class="logo"><b>小天使票選</b></div><button class="btn ghost small" type="button" id="backBtn">回首頁</button></div>
      <section class="cloudcard codebox" style="margin-top:92px">
        ${IMG('star', 'sticker-in')}
        <div class="step" style="color:var(--ink-soft)">第 1 步／共 2 步</div>
        <h2>輸入你的員工編號</h2>
        <form id="codeForm" autocomplete="off">
          <label class="sr-only" for="code">員工編號（CSC 後面 5 碼）</label>
          <div class="empid"><span class="csc" aria-hidden="true">CSC</span><input id="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="00000" maxlength="8" required></div>
          <p class="small muted" style="margin:8px 0 0">輸入 CSC 後面的 5 碼，英文字母大小寫都可以。</p>
          <button class="btn block pink" id="codeBtn" type="submit" style="margin-top:16px;min-height:56px;font-size:20px">下一步</button>
          <div class="msg err" id="codeMsg" role="alert">${err ? esc(err) : ''}</div>
        </form>
      </section>`;
    $('#backBtn').onclick = () => showIntro();
    const inp = $('#code'); inp.focus();
    inp.addEventListener('input', () => { inp.value = fmt(inp.value); $('#codeMsg').textContent = ''; });
    $('#codeForm').onsubmit = async (e) => {
      e.preventDefault();
      const v = fmt(inp.value);
      if (!/^[A-Z0-9]{5}$/.test(v)) return ($('#codeMsg').textContent = '請輸入 CSC 後面的 5 碼。');
      const btn = $('#codeBtn'); btn.disabled = true; btn.textContent = '確認中…';
      const { data, error } = await sb.rpc('vote_login', { p_code: v });
      btn.disabled = false; btn.textContent = '下一步';
      if (error || !data) return ($('#codeMsg').textContent = '網路不穩，請確認連線後再試一次。');
      const M = { bad_code: '找不到這個員工編號，請再確認一次。', closed: '投票已經截止了。', busy: '輸錯太多次了，請過 10 分鐘再試，或找主管協助。' };
      if (data.status !== 'ok') return ($('#codeMsg').textContent = M[data.status] || '發生錯誤，請再試一次。');
      code = v; me = { name: data.name, team: data.team };
      const en = data.entry; hadEntry = !!en;
      pick = { duty: en ? en.duty : null, peer: en ? en.peer : null };
      msg = { duty: (en && en.duty_msg) || '', peer: (en && en.peer_msg) || '' };
      peerQuery = '';
      const pp = pick.peer && byId(pick.peer); peerTeam = pp ? pp.team : (me.team !== '管理職' ? me.team : '一組');
      showBallot();
    };
  }

  // ---------- 選票 ----------
  function msgBox(cat) {
    return `<div class="msgbox" data-msgbox="${cat}" hidden>
        <label class="msg-label" for="msg-${cat}"><span data-msgto="${cat}"></span><span class="small muted">（選填）</span></label>
        <textarea id="msg-${cat}" data-msg="${cat}" maxlength="${MAXMSG}" rows="3" placeholder="例如：謝謝你每次都在關鍵時刻幫我！"></textarea>
        <div class="msg-count small muted"><span data-count="${cat}">0</span>／${MAXMSG}</div>
      </div>`;
  }
  function showBallot() {
    view = 'ballot';
    const duties = people.filter((p) => p.is_duty);
    app.innerHTML = `
      <div class="brand" style="margin-top:6px"><div class="logo"><b>嗨，${esc(me.name)}！</b>　<span class="small">第 2 步／共 2 步</span></div><button class="btn ghost small" type="button" id="backBtn">上一步</button></div>
      ${hadEntry ? `<div class="msg info" style="margin:0 0 14px">你已經投過了，下面是你上次的選擇和留言。可以修改後重新送出，截止前都能改。</div>` : ''}
      <section class="cloudcard">
        <div class="section-head">${CROWN(1, 'var(--gold)')}<h2>最佳 Duty</h2><span class="pill">選 1 位</span></div>
        <p class="sub">最可靠的神隊友，關鍵時刻總能即時支援！</p>
        <div class="names" role="group" aria-label="最佳 Duty 候選人">${duties.map((p) => `<button class="name" type="button" data-cat="duty" data-id="${p.id}" aria-pressed="false">${esc(p.name)}<small>${p.team}</small></button>`).join('')}</div>
        ${msgBox('duty')}
      </section>
      <section class="cloudcard">
        <div class="section-head">${CROWN(2, '#4a8fd0')}<h2>最佳同事</h2><span class="pill">選 1 位</span></div>
        <p class="sub">暖心又給力，讓工作更順利、團隊更有溫度！</p>
        <input class="text search" id="q" type="search" placeholder="搜尋名字" aria-label="搜尋名字" enterkeyhint="search">
        <div class="tabs" role="group" aria-label="組別">${TEAMS.map((t) => `<button class="tab" type="button" data-pt="${t}" aria-pressed="${t === peerTeam}">${t}</button>`).join('')}</div>
        <div class="names" id="peerNames" role="group" aria-label="最佳同事候選人"></div>
        ${msgBox('peer')}
      </section>
      <div class="ballotbar">
        <div class="picks"><div class="pick">最佳 Duty<b id="pd"></b></div><div class="pick">最佳同事<b id="pp"></b></div></div>
        <button class="btn block pink" id="submitBtn" type="button" style="min-height:54px;font-size:19px">${hadEntry ? '確認修改' : '確認送出'}</button>
      </div>`;
    $('#backBtn').onclick = () => showCode();
    app.querySelectorAll('[data-cat="duty"]').forEach((b) => b.onclick = () => { pick.duty = +b.dataset.id; refresh(); });
    const drawPeers = () => {
      const q = peerQuery.trim();
      const list = people.filter((p) => !p.is_manager && (q ? p.name.includes(q) : p.team === peerTeam));
      $('#peerNames').innerHTML = list.length ? list.map((p) => `<button class="name" type="button" data-cat="peer" data-id="${p.id}" aria-pressed="${pick.peer === p.id}">${esc(p.name)}${q ? `<small>${p.team}</small>` : ''}</button>`).join('') : '<p class="muted small">找不到這個名字。</p>';
      app.querySelectorAll('[data-cat="peer"]').forEach((b) => b.onclick = () => { pick.peer = +b.dataset.id; refresh(); });
      app.querySelectorAll('[data-pt]').forEach((x) => x.setAttribute('aria-pressed', String(!q && x.dataset.pt === peerTeam)));
    };
    $('#q').oninput = (e) => { peerQuery = e.target.value; drawPeers(); };
    app.querySelectorAll('[data-pt]').forEach((b) => b.onclick = () => { peerTeam = b.dataset.pt; peerQuery = ''; $('#q').value = ''; drawPeers(); });
    app.querySelectorAll('[data-msg]').forEach((t) => {
      const cat = t.dataset.msg; t.value = msg[cat];
      const upd = () => { msg[cat] = t.value; $(`[data-count="${cat}"]`).textContent = t.value.length; };
      t.addEventListener('input', upd); upd();
    });
    function refresh() {
      app.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(pick[b.dataset.cat] === +b.dataset.id)));
      ['duty', 'peer'].forEach((cat) => {
        const box = $(`[data-msgbox="${cat}"]`), p = pick[cat] && byId(pick[cat]);
        box.hidden = !p;
        if (p) $(`[data-msgto="${cat}"]`).textContent = `想對 ${p.name} 說的話`;
      });
      const pd = $('#pd'), pp = $('#pp');
      pd.textContent = pick.duty ? byId(pick.duty).name : '還沒選'; pd.classList.toggle('empty', !pick.duty);
      pp.textContent = pick.peer ? byId(pick.peer).name : '還沒選'; pp.classList.toggle('empty', !pick.peer);
    }
    $('#submitBtn').onclick = () => {
      if (!pick.duty || !pick.peer) return toast(!pick.duty ? '還沒選最佳 Duty' : '還沒選最佳同事');
      confirmSheet();
    };
    drawPeers(); refresh();
  }

  function confirmSheet() {
    const back = document.createElement('div');
    back.className = 'sheet-back';
    const quote = (t) => t.trim() ? `<p class="confirm-msg">「${esc(t.trim())}」</p>` : '<p class="confirm-msg muted">（沒有留言）</p>';
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
        ${IMG('heart', 'sticker-in')}
        <h2 id="cfTitle" style="font-size:24px">確認你神聖的一票</h2>
        <div class="confirm-row"><span>最佳 Duty</span><b>${esc(byId(pick.duty).name)}</b></div>${quote(msg.duty)}
        <div class="confirm-row"><span>最佳同事</span><b>${esc(byId(pick.peer).name)}</b></div>${quote(msg.peer)}
        <p class="small muted">截止前都可以用員工編號回來修改。</p>
        <div class="row" style="margin-top:8px"><button class="btn ghost" id="cfNo" type="button" style="flex:1">再想想</button><button class="btn pink" id="cfYes" type="button" style="flex:2">${hadEntry ? '送出修改' : '送出投票'}</button></div>
        <div class="msg err" id="cfMsg" role="alert"></div>
      </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    $('#cfNo').onclick = close; $('#cfYes').focus();
    $('#cfYes').onclick = async () => {
      const b = $('#cfYes'), label = b.textContent; b.disabled = true; b.textContent = '送出中…';
      const { data, error } = await sb.rpc('vote_submit', { p_code: code, p_duty: pick.duty, p_peer: pick.peer, p_duty_msg: msg.duty, p_peer_msg: msg.peer });
      if (error) { b.disabled = false; b.textContent = label; $('#cfMsg').textContent = '網路不穩，請確認連線後再按一次。'; return; }
      if (data === 'ok') { close(); return showDone(hadEntry); }
      b.disabled = false; b.textContent = label;
      $('#cfMsg').textContent = { closed: '投票已經截止了。', busy: '嘗試次數太多，請過 10 分鐘再試。', too_long: `留言最多 ${MAXMSG} 字。` }[data] || '發生錯誤，請重新整理後再試一次。';
    };
  }

  function showDone(edited) {
    view = 'done';
    code = '';
    app.innerHTML = `
      <section class="cloudcard center" style="margin-top:40px">
        ${deco(STAR(20), 'left:18px;top:20px', true)}${deco(SPARK(16), 'right:22px;top:26px', true)}${deco(HEART(20), 'right:34px;bottom:70px')}
        ${IMG('heart', 'done-art')}
        <h2 class="title" style="font-size:30px">${edited ? '已更新你的投票！' : '投票完成！'}</h2>
        <p class="lead">謝謝你神聖的一票。<br>每一份幫助都值得被看見，<br>每一份付出都值得被肯定。</p>
        <p class="small muted">截止前想修改，再用員工編號進來就可以。</p>
        <p style="margin-top:14px"><span class="mark">${DEADLINE}</span></p>
        <p style="margin-top:18px"><button class="btn ghost" id="homeBtn" type="button">回首頁</button></p>
      </section>
      <p class="signoff">Together We are Stronger!</p>`;
    announce(edited ? '已更新投票' : '投票完成');
    $('#homeBtn').onclick = () => showIntro();
  }

  // ---------- 得獎名單（主持人公布後） ----------
  function showWinners(celebrate) {
    view = 'winners';
    const medal = (inner) => `<svg class="medal" viewBox="0 0 82 96" aria-hidden="true">
        <path d="M24 52 12 92l14-7 8 11 8-38z" fill="var(--pink)"/><path d="M58 52l12 40-14-7-8 11-8-38z" fill="#4a8fd0"/>
        <circle cx="41" cy="38" r="34" fill="var(--gold)"/>
        <circle cx="41" cy="38" r="34" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 5" opacity=".7"/>
        <circle cx="41" cy="38" r="25" fill="#fff8dc"/>${inner}
      </svg>`;
    const CROWN_IN = '<path d="M27 46 25 29l8 6 8-11 8 11 8-6-2 17z" fill="var(--gold)" stroke="#d79b12" stroke-width="2" stroke-linejoin="round"/>';
    const STAR_IN = '<path d="M41 22l4.6 9.6 10.5 1.3-7.7 7.2 2 10.4L41 45.4l-9.4 5.1 2-10.4-7.7-7.2 10.5-1.3z" fill="var(--gold)" stroke="#d79b12" stroke-width="2" stroke-linejoin="round"/>';
    const list = (arr, kind) => `<div class="medal-list">${arr.map((p) => `<div class="medal-card ${kind}">${medal(kind === 'duty' ? CROWN_IN : STAR_IN)}<div><div class="win-name">${esc(p.name)}</div><span class="team-pill">${esc(p.team)}</span></div></div>`).join('')}</div>`;
    app.innerHTML = `
      <header class="hero" style="padding-bottom:0">
        ${deco(STAR(22), 'left:8%;top:10px', true)}${deco(SPARK(16), 'right:14%;top:6px', true)}${deco(HEART(20), 'right:6%;top:70px')}${deco(SPARK(12, 'var(--pink)'), 'left:20%;top:80px', true)}
        ${IMG('pray', 'sticker l')}${IMG('star', 'sticker r')}
        <span class="year">2026</span>
        <h1 class="title-big">諮詢科<br>小天使</h1>
        <div class="ribbon-row">${WING}<span class="ribbon">得獎名單</span><span class="wing r" style="display:inline-flex">${WING}</span></div>
      </header>
      <p class="callout">恭喜所有小天使！<br>謝謝大家投下神聖的一票</p>
      <section class="cloudcard" style="margin-top:20px">
        <div class="section-head">${CROWN(1, 'var(--gold)')}<h2>最佳 Duty</h2></div>
        <p class="sub">最可靠的神隊友，關鍵時刻總能即時支援！</p>
        ${list(published.duty || [], 'duty')}
      </section>
      <section class="cloudcard">
        <div class="section-head">${CROWN(2, '#4a8fd0')}<h2>最佳同事</h2></div>
        <p class="sub">暖心又給力，讓工作更順利、團隊更有溫度！</p>
        ${list(published.peer || [], 'peer')}
      </section>
      <p class="lead small">每一份幫助都值得被看見，每一份付出都值得被肯定。</p>
      <p class="signoff">Together We are Stronger!</p>
      <p class="small muted center" style="margin:4px 0 8px">諮詢科最強二線，因為有你們而更強大！</p>`;
    announce('得獎名單已公布');
    if (celebrate) burst();
  }

  function burst() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'burst'; document.body.appendChild(c);
    const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
    const colors = ['#ee6b93', '#ffe066', '#7fbfe9', '#f2b730', '#ffffff'];
    const ps = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 3, r: Math.random() * 6 + 4, c: colors[Math.random() * colors.length | 0], a: Math.random() * 6 }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => { p.vy += .3; p.x += p.vx; p.y += p.vy; p.a += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++t < 130) requestAnimationFrame(frame); else c.remove();
    })();
  }

  // 主持人公布／取消公布、截止／開放時，畫面即時切換
  async function syncPublic(fromLive) {
    const { data } = await sb.rpc('vote_public');
    if (!data) return;
    const wasPub = !!published, wasOpen = isOpen;
    published = data.published; isOpen = data.is_open;
    if (published && !wasPub) showWinners(fromLive);
    else if (!published && wasPub) showIntro();
    else if (wasOpen !== isOpen && view === 'intro') showIntro();
  }

  (async function boot() {
    const { data, error } = await sb.rpc('vote_roster');
    if (error || !data) { app.innerHTML = `<div class="msg err" style="margin-top:40px">連不上投票系統，請確認網路後重新整理。</div>`; return; }
    people = data; isOpen = data.length ? data[0].is_open : false;
    const pub = await sb.rpc('vote_public');
    published = pub.data && pub.data.published;
    showIntro();
    sb.channel('angel-vote').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'vote_settings' }, () => syncPublic(true)).subscribe();
    setInterval(() => { if (document.visibilityState === 'visible' && (view === 'intro' || view === 'winners')) syncPublic(true); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncPublic(true); });
  })();
})();
</script>
