<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf5fd">
<title>小天使票選・主持</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cellipse cx=%2250%22 cy=%2250%22 rx=%2240%22 ry=%2216%22 fill=%22none%22 stroke=%22%23f2b730%22 stroke-width=%2210%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="../quiz.css?v=4">
<link rel="stylesheet" href="vote.css?v=10">
</head>
<body class="admin">
<main class="wrap" id="app"></main>
<div id="slips"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="xlsx-lite.js?v=1"></script>
<script src="../quiz.js?v=4"></script>
<script>
(function () {
  const { sb, $, esc, toast, errMsg, sfx, unlockAudio, store } = QP;
  const app = $('#app');
  const DOMAIN = '@players.taiwan3d.app';
  const VOTE_URL = new URL('./', location.href).href;
  let user = null, st = null;

  function topbar() {
    return `<div class="brand"><div class="logo"><b>小天使票選</b>　主持人</div>${user ? `<div class="row"><span class="me-chip">${esc(user.email.replace(DOMAIN, ''))}</span><button class="btn ghost small" id="logoutBtn" type="button">登出</button></div>` : ''}</div>`;
  }
  function bindTop() { const b = $('#logoutBtn'); if (b) b.onclick = async () => { await sb.auth.signOut(); user = null; showLogin(); }; }
  async function copy(text, ok) { try { await navigator.clipboard.writeText(text); toast(ok); } catch (e) { prompt('請長按複製：', text); } }

  function showLogin(msg) {
    app.innerHTML = `${topbar()}
      <section class="card" style="max-width:460px;margin:0 auto">
        <h1 class="title"><span class="mark">主持人登入</span></h1>
        <p class="muted">用搶答派對的主持帳號（sup）登入。</p>
        <form id="lf"><label class="field" for="u">帳號</label><input class="text" id="u" autocomplete="username" required>
          <label class="field" for="p">密碼</label><input class="text" id="p" type="password" autocomplete="current-password" required>
          <div style="margin-top:18px"><button class="btn block" id="lb" type="submit">登入</button></div><div class="msg err" id="lm">${msg ? esc(msg) : ''}</div></form>
      </section>`;
    $('#lf').onsubmit = async (e) => {
      e.preventDefault(); $('#lb').disabled = true;
      const u = $('#u').value.trim().toLowerCase();
      const { data, error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + DOMAIN, password: $('#p').value });
      $('#lb').disabled = false;
      if (error) return ($('#lm').textContent = errMsg(error));
      user = data.user; load();
    };
  }

  async function load() {
    const { data, error } = await sb.rpc('vote_admin_status');
    if (error) {
      if (String(error.message).includes('not_admin')) return showLogin('這個帳號沒有票選主持權限。');
      app.innerHTML = `${topbar()}<div class="msg err">${esc(errMsg(error))}</div>`; bindTop(); return;
    }
    const pub = await sb.rpc('vote_public');
    st = data; st.published = pub.data && pub.data.published; lastSync = new Date(); draw();
  }

  const closeText = (t) => { const d = new Date(t); const w = '日一二三四五六'[d.getDay()]; return `${d.getMonth() + 1}/${d.getDate()}（${w}）${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  function groups(list) {
    const m = new Map();
    list.forEach((p) => { if (!m.has(p.team)) m.set(p.team, []); m.get(p.team).push(p); });
    return [...m.entries()];
  }

  // ---------- 投票狀況（即時） ----------
  let codeTeam = '全部', onlyPending = false, lastSync = null, timer = null;
  const hm = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  function drawStatus() {
    const box = $('#codesCard'); if (!box) return;
    const ppl = st.people;
    const teams = ['全部', ...new Set(ppl.map((p) => p.team))];
    const list = ppl.filter((p) => (codeTeam === '全部' || p.team === codeTeam) && (!onlyPending || !p.has_voted));
    const votedN = list.filter((p) => p.has_voted).length;
    box.innerHTML = `
      <div class="row spread"><h2>投票狀況</h2>
        <div class="row"><button class="btn ghost small" id="copyPending" type="button">複製還沒投的名單</button></div></div>
      <p class="small muted" style="margin:6px 0 12px">每 20 秒自動更新${lastSync ? `・最後更新 ${String(lastSync.getHours()).padStart(2, '0')}:${String(lastSync.getMinutes()).padStart(2, '0')}:${String(lastSync.getSeconds()).padStart(2, '0')}` : ''}。投給誰看「目前排行」，留言看「留言」。</p>
      <div class="row spread" style="align-items:center">
        <div class="tabs" role="group" aria-label="組別" style="padding-bottom:6px">${teams.map((t) => `<button class="tab" type="button" data-ct="${t}" aria-pressed="${t === codeTeam}">${t}</button>`).join('')}</div>
        <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="onlyPending" ${onlyPending ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--pink)"> 只看還沒投的</label>
      </div>
      <p class="small muted" style="margin:4px 0 8px">顯示 ${list.length} 人・已投 ${votedN} 人・未投 ${list.length - votedN} 人</p>
      <div class="codes-wrap"><table class="codes codes-full">
        <thead><tr><th>組別</th><th>姓名</th><th>狀態</th><th>最後投票時間</th></tr></thead>
        <tbody>${list.map((p) => `<tr>
          <td class="small muted">${esc(p.team)}</td><td>${esc(p.name)}</td>
          <td class="small">${p.has_voted ? '<span class="tag-voted">已投</span>' : '<span class="tag-pending">未投</span>'}</td>
          <td class="small muted">${p.voted_at ? hm(p.voted_at) : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">沒有符合的同仁</td></tr>'}
        </tbody></table></div>`;
    box.querySelectorAll('[data-ct]').forEach((b) => b.onclick = () => { codeTeam = b.dataset.ct; drawStatus(); });
    $('#onlyPending').onchange = (e) => { onlyPending = e.target.checked; drawStatus(); };
    $('#copyPending').onclick = () => {
      const pend = ppl.filter((p) => !p.has_voted && (codeTeam === '全部' || p.team === codeTeam));
      if (!pend.length) return toast('全部都投完了！');
      const text = `【小天使票選】還沒投票的夥伴（${pend.length} 人）：\n` + groups(pend).map(([t, l]) => `${t}：${l.map((p) => p.name).join('、')}`).join('\n') + `\n投票網頁 ${VOTE_URL}（輸入員編 CSC 後 5 碼）`;
      copy(text, '已複製還沒投的名單');
    };
  }
  async function syncStatus() {
    if (document.visibilityState !== 'visible' || !st) return;
    const { data } = await sb.rpc('vote_admin_status');
    if (!data) return;
    const wasOpen = st.is_open;
    st.people = data.people; st.is_open = data.is_open; lastSync = new Date();
    if (wasOpen !== data.is_open) return load();
    const voted = st.people.filter((p) => p.has_voted).length, total = st.people.length;
    const v = $('#votedN'); if (v) v.textContent = voted;
    const m = $('#meterBar'); if (m) m.style.width = (voted / total * 100).toFixed(1) + '%';
    const pn = $('#pendingN'); if (pn) pn.textContent = total - voted;
    drawStatus();
    if (st.is_open) loadLiveRank();
  }

  // ---------- 留言（投票期間也看得到，截止後可篩得獎者） ----------
  let msgScope = 'win', hideSender = false, entries = null, results = null;
  let msgOpen = new Set();
  function msgItems() {
    const winIds = new Set([...(results ? results.dutyWin : []), ...(results ? results.peerWin : [])].map((p) => p.id));
    const items = [];
    (entries || []).forEach((e) => {
      if (e.duty_msg) items.push({ to: e.duty, toId: e.duty_id, team: e.duty_team, award: '最佳 Duty', msg: e.duty_msg, from: e.voter, fromTeam: e.voter_team });
      if (e.peer_msg) items.push({ to: e.peer, toId: e.peer_id, team: e.peer_team, award: '最佳同事', msg: e.peer_msg, from: e.voter, fromTeam: e.voter_team });
    });
    const scope = st.is_open ? 'all' : msgScope;
    return items.filter((x) => scope === 'all' || winIds.has(x.toId))
      .sort((a, b) => (a.award === b.award ? 0 : a.award === '最佳 Duty' ? -1 : 1) || a.to.localeCompare(b.to, 'zh-Hant'));
  }
  async function loadMessages() {
    const box = $('#msgBox'); if (!box) return;
    box.innerHTML = '<p class="muted small">載入中…</p>';
    const [e, r] = await Promise.all([sb.rpc('vote_admin_entries'), st.is_open ? null : getResults()]);
    if (e.error) { box.innerHTML = `<div class="msg err">${esc(errMsg(e.error))}</div>`; return; }
    entries = e.data; results = r; drawMessages();
  }
  function drawMessages() {
    const box = $('#msgBox'); if (!box) return;
    const items = msgItems();
    const byTo = new Map();
    items.forEach((x) => { const k = x.award + '|' + x.to; if (!byTo.has(k)) byTo.set(k, []); byTo.get(k).push(x); });
    box.innerHTML = `
      <div class="row" style="gap:14px;margin:10px 0 6px;flex-wrap:wrap">
        ${st.is_open ? `<button class="btn ghost small" id="msgReload" type="button">更新留言</button>` : `<div class="seg" role="group" aria-label="範圍"><button type="button" data-scope="win" aria-pressed="${msgScope === 'win'}">只看得獎者</button><button type="button" data-scope="all" aria-pressed="${msgScope === 'all'}">全部被投的人</button></div>`}
        <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="hideSender" ${hideSender ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--pink)"> 隱藏留言人</label>
      </div>
      ${st.is_open ? `<p class="small muted" style="margin:0 0 6px">投票進行中，先列出目前所有留言（同仁看不到）。截止後可以只看得獎者。</p>` : ''}
      <p class="small muted" style="margin:0 0 10px">共 ${items.length} 則留言，給 ${byTo.size} 位。投票人 ${(entries || []).length} 位。</p>
      <button class="btn pink small" id="dlBtn" type="button" ${items.length ? '' : 'disabled'}>下載 Excel（${hideSender ? '不含' : '含'}留言人）</button>
      ${byTo.size ? `<div class="row spread" style="margin-top:14px"><span class="small muted">點名字展開留言</span><button class="btn ghost small" id="msgAll" type="button">${byTo.size && [...byTo.keys()].every((k) => msgOpen.has(k)) ? '全部收合' : '全部展開'}</button></div>` : ''}
      <div class="msgacc">${[...byTo.entries()].map(([k, list]) => `<details data-k="${esc(k)}" ${msgOpen.has(k) ? 'open' : ''}><summary><span class="award-tag">${list[0].award}</span><span class="to">${esc(list[0].to)}</span><span class="small muted">${esc(list[0].team)}</span><span class="cnt">${list.length} 則</span></summary>
        <div class="msgs">${list.map((x) => `<blockquote>${esc(x.msg)}<cite>${hideSender ? '匿名' : `— ${esc(x.from)}（${esc(x.fromTeam)}）`}</cite></blockquote>`).join('')}</div></details>`).join('') || '<p class="muted">目前沒有留言。</p>'}</div>`;
    box.querySelectorAll('details[data-k]').forEach((d) => d.ontoggle = () => { d.open ? msgOpen.add(d.dataset.k) : msgOpen.delete(d.dataset.k); const ma = $('#msgAll'); if (ma) ma.textContent = [...byTo.keys()].every((k) => msgOpen.has(k)) ? '全部收合' : '全部展開'; });
    const mAll = $('#msgAll'); if (mAll) mAll.onclick = () => { const all = [...byTo.keys()].every((k) => msgOpen.has(k)); msgOpen = all ? new Set() : new Set(byTo.keys()); drawMessages(); };
    const mr = $('#msgReload'); if (mr) mr.onclick = loadMessages;
    box.querySelectorAll('[data-scope]').forEach((b) => b.onclick = () => { msgScope = b.dataset.scope; drawMessages(); });
    $('#hideSender').onchange = (e) => { hideSender = e.target.checked; drawMessages(); };
    $('#dlBtn').onclick = () => {
      const rows = items.map((x) => hideSender ? { 獎項: x.award, 收件人: x.to, 組別: x.team, 留言: x.msg }
        : { 獎項: x.award, 收件人: x.to, 組別: x.team, 留言: x.msg, 留言人: x.from, 留言人組別: x.fromTeam });
      const blob = XlsxLite.toXlsx(rows, { sheet: '小天使留言', widths: hideSender ? [12, 10, 8, 60] : [12, 10, 8, 60, 10, 10] });
      const d = new Date();
      XlsxLite.download(blob, `小天使留言_${!st.is_open && msgScope === 'win' ? '得獎者' : '全部'}${hideSender ? '_匿名' : ''}_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`);
      toast('已下載 Excel');
    };
  }

  function draw() {
    const ppl = st.people, voted = ppl.filter((p) => p.has_voted).length, total = ppl.length;
    const pending = ppl.filter((p) => !p.has_voted);
    app.innerHTML = `${topbar()}
      <div class="admin-grid"><div class="col-left">
      <section class="card">
        <div class="row spread"><h2>${st.is_open ? '投票進行中' : '投票已截止'}</h2>
          <button class="btn small ${st.is_open ? 'ghost' : ''}" id="toggleBtn" type="button">${st.is_open ? '截止投票' : '重新開放投票'}</button></div>
        ${st.close_at ? `<p class="small muted" style="margin:6px 0 0">${st.is_open ? '將於' : '已於'} ${closeText(st.close_at)} 自動截止</p>` : ''}
        <p style="margin:12px 0 6px">已投票 <b style="font-size:26px" id="votedN">${voted}</b> ／ ${total} 人</p>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${total}"><span id="meterBar" style="width:${(voted / total * 100).toFixed(1)}%"></span></div>
        <p class="small muted" style="margin:8px 0 0">還沒投 <span id="pendingN">${total - voted}</span> 人，可在右邊勾「只看還沒投的」提醒他們。</p>
        <div class="row" style="margin-top:14px"><button class="btn ghost small" id="reloadBtn" type="button">重新整理</button></div>
      </section>

      <section class="card">
        ${st.is_open ? '' : '<h2>結果</h2>'}
        ${st.is_open ? `<div id="liveRank"></div>` :
          `<p class="muted small">結果只有主持帳號看得到。聚餐時按「揭曉模式」，用手機或投影一個一個公布。</p>
           <div class="row" style="margin-top:10px"><button class="btn pink" id="revealBtn" type="button">進入揭曉模式</button><button class="btn ghost" id="resultBtn" type="button">先看完整票數</button></div>
           <div class="msg info" style="margin-top:14px">${st.published ? '同仁的投票頁面<b>正在顯示得獎名單</b>（不含票數）。' : '同仁頁面還沒公布得獎名單。揭曉模式播到最後一頁時會自動公布，也可以手動公布。'}</div>
           <div class="row" style="margin-top:8px"><button class="btn small ${st.published ? 'ghost' : ''}" id="pubBtn" type="button">${st.published ? '取消公布（同仁頁回到「已截止」）' : '公布得獎名單到同仁頁面'}</button></div>
           <div id="resultBox"></div>`}
      </section>

      ${st.is_open ? `<section class="card"><h2>留言</h2><div id="msgBox"></div></section>` : ''}

      <section class="card">
        <h2>清空重來</h2>
        <p class="small muted" style="margin:6px 0 10px">「重新開放投票」只是延長投票、保留已投的票和留言。要把所有票、留言和「已投票」紀錄歸零（例如正式開始前清掉試投票），請按下面的按鈕。</p>
        <button class="btn small pink" id="resetBtn" type="button">清空所有票，重新投票</button>
      </section>

      </div><div class="col-right${st.is_open ? '' : ' no-sticky'}">
      ${st.is_open ? '' : `<section class="card"><h2>留言</h2><div id="msgBox"></div></section>`}
      <section class="card" id="codesCard"></section>
      </div></div>`;
    bindTop();
    $('#toggleBtn').onclick = async () => {
      if (!confirm(st.is_open ? '現在就截止投票？截止後同仁就不能再投，你才能看結果。之後還可以重新開放。' : '重新開放投票？已投的票會保留（要歸零請用下方「清空所有票」）。開放期間看不到結果，同仁頁的得獎名單也會收起來。')) return;
      const { error } = await sb.rpc('vote_admin_set_open', { p_open: !st.is_open });
      if (error) return toast(errMsg(error));
      load();
    };
    $('#reloadBtn').onclick = load;
    $('#resetBtn').onclick = async () => {
      if (!confirm(`確定清空所有票？目前已投 ${voted} 人的票和留言會全部作廢，所有人都要重新投一次。`)) return;
      if (!confirm('再確認一次：清空後無法復原。確定要清空嗎？')) return;
      const { error } = await sb.rpc('vote_admin_reset');
      if (error) return toast(errMsg(error));
      toast('已清空，投票重新開始'); load();
    };
    drawStatus();
    loadMessages();
    if (st.is_open) loadLiveRank();
    if (!timer) timer = setInterval(syncStatus, 20000);
    const rb = $('#resultBtn'); if (rb) rb.onclick = showResults;
    const rv = $('#revealBtn'); if (rv) rv.onclick = startReveal;
    const pb = $('#pubBtn'); if (pb) pb.onclick = async () => {
      if (!st.published && !confirm('公布後，同仁打開投票頁面就會看到得獎名單（不含票數）。確定公布？')) return;
      const { error } = await sb.rpc('vote_admin_publish', { p_on: !st.published });
      if (error) return toast(errMsg(error));
      toast(st.published ? '已取消公布' : '已公布到同仁頁面'); load();
    };
  }

  // ---------- 投票期間的即時排行（只有主持帳號看得到） ----------
  let rankHidden = !!store.get('vote.hideRank'), rankAll = false, liveRank = null;
  async function loadLiveRank() {
    if (!$('#liveRank') || rankHidden) return drawLiveRank();
    const r = await getResults(true); if (r) liveRank = r;
    drawLiveRank();
  }
  function drawLiveRank() {
    const box = $('#liveRank'); if (!box) return;
    const head = `<div class="row spread"><h2>目前排行</h2><button class="btn ghost small" id="rankToggle" type="button">${rankHidden ? '顯示排行' : '隱藏排行'}</button></div>`;
    if (rankHidden) {
      box.innerHTML = `${head}<p class="muted small" style="margin:8px 0 0">排行已隱藏。投影或分享螢幕時可以先藏起來。</p>`;
    } else if (!liveRank) {
      box.innerHTML = `${head}<p class="muted small">載入中…</p>`;
    } else {
      const r = liveRank;
      const rows = (arr, wins, n) => {
        if (!arr.some((p) => p.votes)) return '<p class="muted small" style="margin:4px 0 0">還沒有人得票</p>';
        const ids = new Set(wins.map((p) => p.id)), max = Math.max(1, ...arr.map((p) => p.votes));
        const shown = (rankAll ? arr : arr.slice(0, Math.max(n, wins.length))).filter((p) => p.votes);
        let rank = 0, prev = null;
        return `<ol class="liverank">${shown.map((p, i) => { if (p.votes !== prev) { rank = i + 1; prev = p.votes; }
          return `<li class="${ids.has(p.id) ? 'in' : ''}"><span class="n">${rank}</span><span class="who">${esc(p.name)}<small>${esc(p.team)}</small></span><span class="bar"><span style="width:${(p.votes / max * 100).toFixed(1)}%"></span></span><span class="v">${p.votes}</span></li>`; }).join('')}</ol>`;
      };
      const more = r.duty.filter((p) => p.votes).length > 3 || r.peer.length > Math.max(5, r.peerWin.length);
      box.innerHTML = `${head}
        <p class="small muted" style="margin:6px 0 4px">已投 ${r.voted} 人。排名隨時會變，每 20 秒自動更新；黃色是目前在得獎範圍內的人。</p>
        <h3 class="rank-h">最佳 Duty <span class="small muted">取 1 名${r.dutyWin.length > 1 ? `，目前同票 ${r.dutyWin.length} 人` : ''}</span></h3>${rows(r.duty, r.dutyWin, 3)}
        <h3 class="rank-h">最佳同事 <span class="small muted">取 5 名${r.peerWin.length > 5 ? `，目前第 5 名同票 ${r.peerWin.length} 人並列` : ''}</span></h3>${rows(r.peer, r.peerWin, 5)}
        ${more ? `<button class="btn ghost small" id="rankAll" type="button" style="margin-top:10px">${rankAll ? '只看前幾名' : '看完整排行'}</button>` : ''}
        <p class="small muted" style="margin:12px 0 0">截止後才能進入揭曉模式。</p>`;
      const ra = $('#rankAll'); if (ra) ra.onclick = () => { rankAll = !rankAll; drawLiveRank(); };
    }
    $('#rankToggle').onclick = () => { rankHidden = !rankHidden; store.set('vote.hideRank', rankHidden); rankHidden ? drawLiveRank() : loadLiveRank(); };
  }

  // ---------- 結果 ----------
  async function getResults(quiet) {
    const { data, error } = await sb.rpc('vote_admin_results');
    if (error) { if (quiet) return null; toast(String(error.message).includes('still_open') ? '請先截止投票' : errMsg(error)); return null; }
    const duty = data.duty, peer = data.peer;
    const dTop = duty.length && duty[0].votes > 0 ? duty[0].votes : 0;
    const dutyWin = dTop ? duty.filter((p) => p.votes === dTop) : [];
    const cut = peer.length ? (peer[Math.min(4, peer.length - 1)].votes) : 0;
    const peerWin = peer.filter((p) => p.votes >= cut && p.votes > 0);
    return { ...data, dutyWin, peerWin };
  }

  async function showResults() {
    const r = await getResults(); if (!r) return;
    const list = (arr, wins) => { const ids = new Set(wins.map((p) => p.id)); return `<ol class="ranklist">${arr.map((p, i) => `<li class="${ids.has(p.id) ? 'win' : ''}"><span class="n">${i + 1}</span><span>${esc(p.name)}</span><span class="small muted">${p.team}</span><span class="v">${p.votes} 票</span></li>`).join('')}</ol>`; };
    $('#resultBox').innerHTML = `<p class="small muted" style="margin-top:14px">投票率 ${r.voted}／${r.total}。黃底是得獎者${r.peerWin.length > 5 ? `；最佳同事第 5 名同票，共 ${r.peerWin.length} 人並列` : ''}${r.dutyWin.length > 1 ? `；最佳 Duty 同票 ${r.dutyWin.length} 人並列` : ''}。</p>
      <h3 style="margin-top:12px">最佳 Duty</h3>${list(r.duty, r.dutyWin)}
      <h3 style="margin-top:16px">最佳同事（有得票的人）</h3>${list(r.peer, r.peerWin)}`;
  }

  // ---------- 揭曉模式 ----------
  async function startReveal() {
    unlockAudio();
    const r = await getResults(); if (!r) return;
    const peerOrder = r.peerWin.slice().reverse(); // 票數少的先揭曉，壓軸最高票
    const steps = [
      { kind: 'title' },
      { kind: 'duty-q' }, { kind: 'duty-a' },
      { kind: 'peer-q' },
      ...peerOrder.map((_, i) => ({ kind: 'peer-a', n: i + 1 })),
      { kind: 'end' },
    ];
    let i = 0, published = !!(st && st.published);
    const el = document.createElement('div');
    el.className = 'stage-reveal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', '揭曉模式');
    document.body.appendChild(el);
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}
    const HALO = '<img src="img/angel-heart.webp" alt="" width="150" style="width:clamp(110px,18vw,170px);height:auto">';
    const ASK = '<img class="mystery" src="img/angel-pray.webp" alt="">';
    const names = (arr, cls = '') => `<div class="winners">${arr.map((p) => `<div class="chip-win ${cls}"><span class="star-badge"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.1l6.1-.7z" fill="#f2b730" stroke="#f2b730" stroke-width="1.6" stroke-linejoin="round"/></svg></span>${esc(p.name)}<small class="small muted" style="display:block;font-size:16px">${p.team}</small></div>`).join('')}</div>`;
    function render() {
      const s = steps[i];
      let body = '';
      if (s.kind === 'title') body = `${HALO}<div class="award-name">2026 諮詢科小天使票選</div><div class="winner" style="font-size:clamp(36px,9vw,80px)">揭曉時刻</div><p class="muted">每一份幫助都值得被看見，每一份付出都值得被肯定。</p>`;
      if (s.kind === 'duty-q') body = `<div class="award-name">最佳 Duty</div><p class="muted">最可靠的神隊友，關鍵時刻總能即時支援</p>${ASK}`;
      if (s.kind === 'duty-a') body = `<div class="award-name">最佳 Duty</div>${HALO}${r.dutyWin.length ? `<div class="winner">${r.dutyWin.map((p) => esc(p.name)).join('、')}<small>${r.dutyWin.map((p) => p.team).join('、')}</small></div>${r.dutyWin.length > 1 ? `<p class="tie">同票並列</p>` : ''}` : '<p>沒有票</p>'}`;
      if (s.kind === 'peer-q') body = `<div class="award-name">最佳同事</div><p class="muted">暖心又給力，讓工作更順利、團隊更有溫度</p>${ASK}<p class="muted">共 ${r.peerWin.length} 位${r.peerWin.length > 5 ? '（含同票並列）' : ''}</p>`;
      if (s.kind === 'peer-a') body = `<div class="award-name">最佳同事</div><div class="winners">${peerOrder.slice(0, s.n).map((p, k) => `<div class="chip-win ${k === s.n - 1 ? 'new' : ''}"><span class="star-badge"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.1l6.1-.7z" fill="#f2b730" stroke="#f2b730" stroke-width="1.6" stroke-linejoin="round"/></svg></span>${esc(p.name)}<small class="small muted" style="display:block;font-size:16px">${p.team}</small></div>`).join('')}</div>${r.peerWin.length > 5 && s.n === peerOrder.length ? `<p class="tie">第 5 名同票，${r.peerWin.length} 位並列</p>` : ''}`;
      if (s.kind === 'end') body = `${HALO}<div class="award-name">恭喜所有小天使！</div><div class="award-name" style="font-size:22px;margin-top:6px">最佳 Duty</div>${names(r.dutyWin)}<div class="award-name" style="font-size:22px;margin-top:10px">最佳同事</div>${names(r.peerWin)}<p class="muted">諮詢科最強二線，因為有你們而更強大！</p>`;
      el.innerHTML = `<div class="inner">${body}</div>
        <div class="controls"><button class="btn ghost small" id="rvPrev" type="button" ${i === 0 ? 'disabled' : ''}>上一步</button>
          ${i < steps.length - 1 ? `<button class="btn pink" id="rvNext" type="button" style="min-width:160px">${s.kind.endsWith('-q') || s.kind === 'peer-a' ? '揭曉！' : '下一步'}</button>` : ''}
          <button class="btn ghost small" id="rvExit" type="button">離開</button></div>`;
      $('#rvPrev').onclick = () => { if (i > 0) { i--; render(); } };
      const nx = $('#rvNext'); if (nx) { nx.onclick = next; nx.focus(); }
      $('#rvExit').onclick = exit;
      if (s.kind === 'duty-a' || s.kind === 'peer-a' || s.kind === 'end') { sfx.fanfare(); burst(); }
      if (s.kind === 'end' && !published) { published = true; sb.rpc('vote_admin_publish', { p_on: true }).then(({ error }) => { if (!error) toast('已同步公布到同仁的投票頁面'); }); }
    }
    function next() { if (i < steps.length - 1) { i++; render(); } }
    function exit() { load(); el.remove(); document.removeEventListener('keydown', onKey); try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} }
    function onKey(e) { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); } if (e.key === 'ArrowLeft' && i > 0) { i--; render(); } if (e.key === 'Escape') exit(); }
    document.addEventListener('keydown', onKey);
    render();
  }

  // 彩紙：只在揭曉那一刻灑一次
  function burst() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'burst'; document.body.appendChild(c);
    const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
    const colors = ['#ec6a8e', '#ffe27a', '#7fbfe9', '#f2b730', '#ffffff'];
    const ps = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: colors[Math.random() * colors.length | 0], a: Math.random() * 6 }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++t < 140) requestAnimationFrame(frame); else c.remove();
    })();
  }

  (async function boot() {
    const { data } = await sb.auth.getUser();
    user = data && data.user;
    if (!user) return showLogin();
    load();
  })();
})();
</script>
